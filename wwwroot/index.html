<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasks · Categories</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <nav class="nav">
            <a href="tasks.html" class="nav-link">Tasks</a>
            <a href="index.html" class="nav-link active" aria-current="page">Categories</a>
        </nav>

        <header class="header">
            <h1>Categories</h1>
            <p class="subtitle">Organize your task categories</p>
        </header>

        <form id="create-form" class="card create-form">
            <input id="create-name" type="text" placeholder="New category name" maxlength="100" required>
            <button type="submit" class="btn btn-primary">Add</button>
        </form>

        <p id="message" class="message" role="status" hidden></p>

        <section class="card">
            <ul id="category-list" class="list"></ul>
            <p id="empty" class="empty" hidden>No categories yet.</p>
        </section>
    </main>

    <script src="common.js"></script>
    <script src="categories.js"></script>
</body>
</html>
